# Cloudflare Workers config. Deploy with:  npm run deploy
name = "uk-platform-train-board"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Lets the Worker read when this version was deployed (shown in the page footer).
[version_metadata]
binding = "CF_VERSION_METADATA"

[assets]
directory = "./public"
binding = "ASSETS"

# Secrets (not stored here):
#   RDM_API_KEY  →  npx wrangler secret put RDM_API_KEY   (National Rail)
#   TFL_APP_KEY  →  npx wrangler secret put TFL_APP_KEY   (optional, Tube)
# Optional plain variable if your endpoint differs:
# [vars]
# RDM_DEPARTURES_URL = "https://api1.raildata.org.uk/.../GetDepBoardWithDetails"
