<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UK Departure Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div id="chips" class="chips"></div>
    <form id="addForm" class="add" autocomplete="off">
      <div class="searchbox">
        <input id="stationInput" type="search" enterkeyhint="search" placeholder="Station, Tube or bus stop…"
          aria-label="Station, Tube station or bus stop"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="dd">
        <div id="dd" class="dd" role="listbox" hidden></div>
      </div>
      <button id="nearBtn" class="near" type="button" title="Find stops and stations near you">📍 Near me</button>
      <button type="submit">+ Add</button>
    </form>
    <span id="msg" class="msg" role="status"></span>
    <span class="meta"><span id="tflCredit" hidden>Powered by TfL Open Data ·</span><span id="mode"></span> · refresh 30 s
      <button id="fsBtn" class="fs" type="button" title="Full screen">⛶</button></span>
  </header>
  <main id="grid" class="grid"></main>
  <footer id="footer" class="foot"></footer>
  <script src="app.js"></script>
</body>
</html>
